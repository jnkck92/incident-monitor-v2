name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (z.B. 1.0.0)'
        required: true
      next_version:
        description: 'Nächste Entwicklungsversion (z.B. 1.1.0-SNAPSHOT)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ── Version in package.json setzen ───────────────────────────
      - name: Set Release Version in package.json
        run: npm version ${{ github.event.inputs.release_version }} --no-git-tag-version

      # ── Build ────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
            VITE_DIVERA_API_KEY: ${{ secrets.VITE_DIVERA_API_KEY }}

      # ── Docker ───────────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_DIVERA_API_KEY=${{ secrets.VITE_DIVERA_API_KEY }}
          tags: |
            ghcr.io/${{ github.repository }}:v${{ github.event.inputs.release_version }}
            ghcr.io/${{ github.repository }}:latest

      # ── Git: Release Version committen + Tag setzen ──────────────
      - name: Commit Release Version & create Tag
        run: |
          git add package.json
          git commit -m "Release version ${{ github.event.inputs.release_version }}"
          git tag -a v${{ github.event.inputs.release_version }} -m "Release v${{ github.event.inputs.release_version }}"

      # ── Nächste Version setzen ────────────────────────────────────
      - name: Set next Version in package.json
        run: npm version ${{ github.event.inputs.next_version }} --no-git-tag-version

      - name: Commit next Version
        run: |
          git add package.json
          git commit -m "Prepare next development version ${{ github.event.inputs.next_version }}"

      # ── Push ─────────────────────────────────────────────────────
      - name: Push commits and tag
        run: |
          git push origin main
          git push origin v${{ github.event.inputs.release_version }}

      # ── GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.release_version }}
          name: Release v${{ github.event.inputs.release_version }}
          generate_release_notes: true
          body: |
            Docker Image: `ghcr.io/${{ github.repository }}:v${{ github.event.inputs.release_version }}`