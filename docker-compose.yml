services:
  incident-monitor:
    image: ghcr.io/jnkck92/incident-monitor-v2:latest
    container_name: incident-monitor
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./config.json:/usr/share/nginx/html/config.json:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s